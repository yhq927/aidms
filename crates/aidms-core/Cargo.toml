[package]
name = "aidms-core"
version = "0.1.0"
edition = "2021"
description = "AIDMS 核心数据层：SQLite + FTS5 + sqlite-vec + jieba（不依赖 Tauri，可独立测试）"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
jieba = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
pdf-extract = "0.7"
# PDF 页数统计（pdf-extract 已传递依赖 lopdf，直接声明用于 MAX_PAGES 预检，无新增二进制）
lopdf = "0.34"
# docx/xlsx 纯文本提取（zip+xml 手写解析，Rust 降级路线，见 parse.rs；不引入 mammoth/SheetJS 等重依赖）
zip = { version = "2", default-features = false, features = ["deflate"] }
# keyring 不可用时的本地加密兜底（纯 Rust，无 C 依赖）
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
