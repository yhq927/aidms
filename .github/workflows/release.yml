name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 当前阶段（2026-08-25）：只构建 Windows，集中验证 Windows 真安装包形态。
# macOS 暂不在矩阵内——原因：需要苹果开发者证书做签名/公证，当前仓库 Secrets
# 里的 APPLE_* 为无效值会导致 codesign 失败。等 Windows 真安装包验证 OK、且
# 拿到有效 APPLE_CERTIFICATE/APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID 后，再恢复：
#   matrix.include 加回 "- os: macos-latest / platform: macos"，
#   Tauri build 的 env 加回 APPLE_* 与 TAURI_SIGNING_*（Windows 侧）。

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---- 编译期系统依赖：OCR feature 链接 libtesseract + leptonica ----
      # 必须同时装 leptonica（tesseract 的底层依赖，leptonica-sys 会单独找它）；
      # triplet 必须用 x64-windows-static-md：Rust 在 MSVC 下默认静态链接，
      # leptonica-sys / tesseract-sys 的 vcpkg 查找用的就是这个 triplet，
      # 用默认 x64-windows 会报 LibNotFound。
      - name: vcpkg tesseract + leptonica (Windows)
        id: vcpkg
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: tesseract leptonica
          triplet: x64-windows-static-md
          token: ${{ github.token }}

      # ---- 下载 OCR 中英文词库到随包 resources（chi_sim+eng，~30MB）----
      - name: Download tessdata
        shell: bash
        run: bash scripts/download-tessdata.sh

      # ---- 安装前端依赖（node_modules 不入库，必须在 CI 上安装；beforeBuildCommand 会跑 vite/tsc）----
      - name: Install frontend deps
        run: npm --prefix frontend ci

      # ---- Tauri Windows 构建（启用 ocr feature，输出 NSIS 安装向导）----
      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # vcpkg-action 只把 VCPKG_ROOT 设进自己那一步的 env，不会透传给后续步骤；
          # 其 outputs.vcpkg-root 在本 action 版本下取不到值，会导致 leptonica-sys 报
          # VcpkgNotFound。这里直接写死 vcpkg 安装根目录（action 固定装到 <workspace>/vcpkg）。
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        with:
          projectPath: src-tauri
          args: --features ocr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidms-windows
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
